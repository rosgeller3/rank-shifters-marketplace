services:
  - type: web
    name: rank-shifters-marketplace
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: ChangeMe123!
      - key: WHATSAPP_NUMBER
        value: "919712565375"
      - key: DATA_FILE
        value: /opt/render/project/src/data/data.json
      - key: JWT_SECRET
        generateValue: true
